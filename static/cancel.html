<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestionar Turno - Citaly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; color: #0F172A; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-6 text-center">
    
    <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
      🗓️
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Gestionar tu Turno</h1>
    <p class="text-xs text-slate-500 mb-6">Puedes cancelar tu cita en 1 clic para liberar el horario si no puedes asistir.</p>

    <!-- Estado / Card Resumen -->
    <div id="status-card" class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 text-left space-y-2">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-500">Estado actual:</span>
        <span id="badge-status" class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-md font-bold">Activo / Confirmado</span>
      </div>
      <div class="text-sm font-bold text-slate-900" id="info-service">Ortodoncia / Control</div>
      <div class="text-xs text-slate-600" id="info-time">Fecha y hora cargando...</div>
    </div>

    <button id="btn-cancel" onclick="processCancellation()" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm mb-3">
      Confirmar Cancelación (Liberar Slot)
    </button>

    <a href="/" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-colors">
      Volver a la página principal
    </a>

    <div id="msg-result" class="mt-4 text-xs font-semibold text-emerald-600 hidden"></div>
  </div>

  <script>
    // Extraer token de la URL (/r/TOKEN o ?token=TOKEN)
    const pathParts = window.location.pathname.split('/');
    let token = pathParts[pathParts.length - 1];
    if (!token || token === 'cancel.html' || token === 'r') {
      const urlParams = new URLSearchParams(window.location.search);
      token = urlParams.get('token');
    }

    async function processCancellation() {
      if (!token) {
        alert('Token de turno inválido');
        return;
      }

      const btn = document.getElementById('btn-cancel');
      btn.disabled = true;
      btn.innerText = 'Cancelando turno...';

      try {
        const res = await fetch(`/api/v1/booking/cancel/${token}`, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          document.getElementById('badge-status').className = 'px-2 py-0.5 bg-red-100 text-red-800 rounded-md font-bold';
          document.getElementById('badge-status').innerText = 'CANCELADO';
          
          const resultDiv = document.getElementById('msg-result');
          resultDiv.innerText = '✅ ¡Tu turno ha sido cancelado exitosamente! El horario fue liberado.';
          resultDiv.classList.remove('hidden');
          btn.style.display = 'none';
        } else {
          alert(data.detail || 'No se pudo cancelar el turno.');
          btn.disabled = false;
          btn.innerText = 'Confirmar Cancelación (Liberar Slot)';
        }
      } catch (e) {
        alert('Error al comunicarse con el servidor.');
        btn.disabled = false;
        btn.innerText = 'Confirmar Cancelación (Liberar Slot)';
      }
    }
  </script>
</body>
</html>
