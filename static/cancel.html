<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Gestionar Cita — Citaly</title>
  <meta name="theme-color" content="#F8FAFC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet"/>
  
  <style>
    body {
      font-family: 'Work Sans', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .font-display { font-family: 'Hanken Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 12px 36px 0 rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md glass-card rounded-3xl p-6 md:p-8 text-center relative overflow-hidden">
    
    <!-- Logo Monograma -->
    <div class="flex items-center justify-center gap-2 mb-4">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 22 34 L 52 34 M 42 34 L 42 86" stroke="#0F172A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 42 46 L 58 64 L 88 26" stroke="#D97706" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-display font-extrabold text-xl text-slate-900 tracking-tight">Citaly</span>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 mb-1 font-display" id="doctor-name">Dr. Alejandro Pérez</h1>
    <p class="text-xs font-semibold text-slate-500 mb-6" id="business-name">Consultorio Odontológico Especializado</p>

    <!-- Estado / Resumen de la Cita -->
    <div id="status-card" class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200 mb-6 text-left space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-500 font-bold uppercase tracking-wider font-mono text-[10px]">Estado de la Cita:</span>
        <span id="badge-status" class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-extrabold font-mono text-xs">
          🟢 Agendada
        </span>
      </div>

      <div class="border-t border-slate-200 pt-3">
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider font-mono block mb-0.5">Paciente:</span>
        <div class="text-sm font-bold text-slate-900 font-display" id="info-patient">María Gómez</div>
      </div>

      <div>
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider font-mono block mb-0.5">Tratamiento:</span>
        <div class="text-sm font-bold text-amber-700 font-display" id="info-service">Limpieza & Blanqueamiento</div>
      </div>

      <div>
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider font-mono block mb-0.5">Fecha y Hora:</span>
        <div class="text-base font-extrabold text-slate-900 font-mono" id="info-time">15/08 a las 10:00 hs</div>
      </div>
    </div>

    <!-- 3 Botones Principales Simples -->
    <div id="actions-container" class="space-y-3">
      <button id="btn-confirm" onclick="confirmAppointment()" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
        <span>✅ Confirmar Asistencia</span>
      </button>

      <button id="btn-reprogram" onclick="reprogramAppointment()" class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-2xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
        <span>📅 Reprogramar Cita</span>
      </button>

      <button id="btn-cancel" onclick="cancelAppointment()" class="w-full py-3 bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-600 font-semibold rounded-2xl border border-slate-200 transition-all text-xs">
        <span>Cancelar</span>
      </button>
    </div>

    <!-- Mensaje de Resultado -->
    <div id="msg-result" class="mt-4 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-800 hidden font-mono"></div>

    <div class="mt-6">
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors">
        ← Ir a la página principal del consultorio
      </a>
    </div>

  </div>

  <script>
    // Extraer token de la URL (/r/TOKEN o ?token=TOKEN)
    const pathParts = window.location.pathname.split('/');
    let token = pathParts[pathParts.length - 1];
    if (!token || token === 'cancel.html' || token === 'r') {
      const urlParams = new URLSearchParams(window.location.search);
      token = urlParams.get('token');
    }

    let appointmentData = null;

    async function loadAppointmentInfo() {
      if (!token) return;
      try {
        const res = await fetch(`/api/v1/booking/appointment/${token}`);
        if (res.ok) {
          appointmentData = await res.json();
          document.getElementById('doctor-name').innerText = appointmentData.doctor_name || 'Dr. Alejandro Pérez';
          document.getElementById('business-name').innerText = appointmentData.business_name || 'Consultorio Odontológico';
          document.getElementById('info-patient').innerText = appointmentData.patient_name || 'Paciente';
          document.getElementById('info-service').innerText = `${appointmentData.service_name} (${appointmentData.duration_minutes} min)`;
          document.getElementById('info-time').innerText = `${appointmentData.date_formatted} a las ${appointmentData.time_formatted}`;

          updateStatusBadge(appointmentData.status);
        }
      } catch (e) {
        console.error('Error al cargar info de la cita:', e);
      }
    }

    function updateStatusBadge(status) {
      const badge = document.getElementById('badge-status');
      if (status === 'CONFIRMED') {
        badge.className = 'px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-extrabold font-mono text-xs';
        badge.innerText = '🟢 Confirmada';
      } else if (status === 'CANCELLED') {
        badge.className = 'px-3 py-1 bg-red-100 text-red-800 rounded-full font-extrabold font-mono text-xs';
        badge.innerText = '🔴 Cancelada';
        document.getElementById('actions-container').style.display = 'none';
        showMsg('Esta cita fue cancelada. ¡Gracias por avisarnos!');
      } else {
        badge.className = 'px-3 py-1 bg-amber-100 text-amber-800 rounded-full font-extrabold font-mono text-xs';
        badge.innerText = '🟡 Pendiente';
      }
    }

    function showMsg(text, isError = false) {
      const msgDiv = document.getElementById('msg-result');
      msgDiv.innerText = text;
      msgDiv.className = isError 
        ? 'mt-4 p-4 rounded-2xl bg-red-50 border border-red-200 text-xs font-bold text-red-800 font-mono'
        : 'mt-4 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-800 font-mono';
      msgDiv.classList.remove('hidden');
    }

    async function confirmAppointment() {
      if (!token) return;
      try {
        const res = await fetch(`/api/v1/booking/confirm/${token}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          updateStatusBadge('CONFIRMED');
          showMsg('Tu asistencia fue confirmada. ¡Te esperamos!');
        }
      } catch (e) {
        alert('Error de conexión');
      }
    }

    function reprogramAppointment() {
      if (appointmentData && appointmentData.patient_whatsapp) {
        window.location.href = `/?phone=${encodeURIComponent(appointmentData.patient_whatsapp)}&reprogram=1`;
      } else {
        window.location.href = '/';
      }
    }

    async function cancelAppointment() {
      if (!token) return;
      if (!confirm('¿Estás seguro de que deseas cancelar tu turno?')) return;

      try {
        const res = await fetch(`/api/v1/booking/cancel/${token}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          updateStatusBadge('CANCELLED');
        } else {
          alert(data.detail || 'No se pudo cancelar el turno.');
        }
      } catch (e) {
        alert('Error de conexión');
      }
    }

    loadAppointmentInfo();
  </script>
</body>
</html>
